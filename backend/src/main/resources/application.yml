# All environment-specific values come from environment variables.
# Never put real credentials in this file.

server:
  port: ${PORT:8080}

spring:
  application:
    name: digital-watershed-backend
  mongodb:
    # Same variable name as the Node backend.
    uri: ${MONGO_URI:mongodb://localhost:27017}
    # The Node backend's MONGO_URI has no database in its path, so Mongoose used the driver
    # default "test" - that is where the existing data lives. This setting overrides any
    # database named in the URI path, so set MONGO_DATABASE when pointing at another database.
    database: ${MONGO_DATABASE:test}
  data:
    mongodb:
      # Never create or alter indexes on the existing database automatically.
      auto-index-creation: false

app:
  cors:
    # Comma-separated list of origins allowed to call the API (Vite dev server by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      # Expose the health check under the same /api prefix the React app uses: GET /api/health
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
